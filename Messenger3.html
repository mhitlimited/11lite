<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Messenger Collection — CPbOX</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <nav class="nav" aria-label="Primary">
        <div class="brand">
          <span class="dot"></span>
          <span>CPbOX</span>
        </div>

        <div class="actions">
          <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
            <svg id="iconMoon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79z"/>
            </svg>
            <svg id="iconSun" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none" aria-hidden="true">
              <path d="M12 2.75a1 1 0 0 1 1 1V5a1 1 0 1 1-2 0V3.75a1 1 0 0 1 1-1zm0 14.5a1 1 0 0 1 1 1V19a1 1 0 1 1-2 0v-1.75a1 1 0 0 1 1-1zm8.25-5.5a1 1 0 0 1 0 2h-1.75a1 1 0 1 1 0-2h1.75zm-14.5 0a1 1 0 0 1 0 2H3.75a1 1 0 1 1 0-2h1.75zm9.7-5.46a1 1 0 0 1 1.42 0l1.24 1.24a1 1 0 0 1-1.41 1.41L9.84 7.67a1 1 0 0 1 1.41-1.41zm-8.9 8.9a1 1 0 0 1 1.42 0l1.24 1.24a1 1 0 0 1-1.41 1.41L7.08 17.32a1 1 0 0 1 1.41-1.41zm0-8.9a1 1 0 0 1 0 1.42L7.1 8.9A1 1 0 0 1 5.69 7.49L6.93 6.25a1 1 0 0 1 1.42 0zm11.59 11.59a1 1 0 0 1 0 1.42l-1.24 1.24a1 1 0 1 1-1.41-1.41l1.24-1.24a1 1 0 0 1 1.41 0zM12 7a5 5 0 1 1 0 10a5 5 0 0 1 0-10z"/>
            </svg>
          </button>

          <button class="icon-btn hamburger" id="menuToggle" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z" />
            </svg>
          </button>

          <button id="langToggle" class="icon-btn" aria-label="Toggle Language">EN/BN</button>
        </div>

        <div class="menu" id="menu">
          <a href="index.html">Home</a>
          <a class="active" href="#">Apps</a>
          <a href="index.html#docs">Docs</a>
          <a href="index.html#contact">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1 class="page-title">Messenger Versions</h1>
      <p class="muted">নীচে প্রতিটি ভার্সনের জন্য আলাদা বক্স ও ডাউনলোড বাটন আছে। বাটনে ক্লিক করে সোজা ডাউনলোড শুরু হবে।</p>
      <div style="margin: .5rem 0 1rem"><a id="backBtn" class="btn btn-ghost" href="index.html" data-i18n="back">পিছনে</a></div>
    </section>

    <section class="grid">
      <div id="cards" class="grid"></div>
    </section>
  </main>

  <div id="timerModal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="timerTitle" aria-describedby="timerDesc">
    <div class="modal-content card">
      <h2 id="timerTitle">Preparing your download…</h2>
      <p id="timerDesc" class="muted"><span id="countdown">5</span> সেকেন্ড পরে ডাউনলোড শুরু হবে।</p>
      <button id="downloadNow" class="btn">Download now</button>
      <button id="cancelDownload" class="btn btn-ghost">Cancel</button>
    </div>
  </div>

  <footer>
    <div class="container foot-inner">
      <div class="tiny">© <span id="year"></span> CyberHub. All rights reserved.</div>
      <nav class="foot-links tiny">
        <a href="#privacy">Privacy</a>
        <a href="#terms">Terms</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    const versions = [
      { name: 'Messenger (Official Play Store)', link: 'https://play.google.com/store/apps/details?id=com.facebook.orca' },
      { name: 'Messenger 2', link: '/downloads/messenger-2.apk' },
      { name: 'Messenger 3', link: '/downloads/messenger-3.apk' }
    ];

    const cardsWrap = document.getElementById('cards');
    cardsWrap.classList.add('grid-3');
    versions.forEach((v) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-body">
          <h3>${v.name}</h3>
          <p class="muted">লাইটওয়েট মেসেঞ্জার ভ্যারিয়েন্ট।</p>
          <div class="actions">
            <a href="#" class="btn download-btn" data-link="${v.link}">ডাউনলোড</a>
          </div>
        </div>
      `;
      cardsWrap.appendChild(card);
    });

    const modal = document.getElementById('timerModal');
    const countdownEl = document.getElementById('countdown');
    const downloadNowBtn = document.getElementById('downloadNow');
    const cancelBtn = document.getElementById('cancelDownload');
    let timer = null;
    let targetLink = null;
    let remaining = 5;

    function openModal(link) {
      targetLink = link;
      remaining = 5;
      countdownEl.textContent = remaining;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      timer = setInterval(() => {
        remaining -= 1;
        countdownEl.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(timer);
          startDownload();
        }
      }, 1000);
    }

    function closeModal() {
      if (timer) clearInterval(timer);
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }

    function startDownload() {
      window.location.href = targetLink;
      closeModal();
    }

    document.querySelectorAll('.download-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const link = btn.getAttribute('data-link');
        openModal(link);
      });
    });

    downloadNowBtn.addEventListener('click', startDownload);
    cancelBtn.addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
